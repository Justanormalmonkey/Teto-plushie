<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Teto</title>
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      background-color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }

    .teto-button {
      background: transparent;
      border: none;
      padding: 12px;
      margin: 0;
      cursor: pointer;
      outline: none;
      touch-action: manipulation;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.14s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .teto-button:focus-visible {
      outline: 3px solid #e64966;
      outline-offset: 6px;
      border-radius: 20px;
    }

    @media (hover: hover) {
      .teto-button:hover {
        transform: scale(1.03);
      }
    }

    .teto-button.is-pressed,
    .teto-button:active {
      transform: scale(0.92);
    }

    .teto-img {
      display: block;
      max-width: min(58vw, 240px);
      max-height: 55vh;
      width: auto;
      height: auto;
      object-fit: contain;
      pointer-events: none;
      -webkit-user-drag: none;
    }
  </style>
</head>
<body>

  <button id="tetoBtn" class="teto-button" type="button" aria-label="Press Kasane Teto plush">
    <img src="teto-plush.png.JPG" alt="Kasane Teto Plush" class="teto-img" draggable="false" />
  </button>

  <script>
    const tetoBtn = document.getElementById('tetoBtn');

    const audio = document.createElement('audio');
    audio.preload = 'auto';
    audio.src = 'teto-sound.mp3.mp3';
    audio.style.display = 'none';
    document.body.appendChild(audio);
    audio.load();

    function playTetoSound() {
      try {
        audio.currentTime = 0;
        audio.play().catch(() => {});
      } catch (err) {}
    }

    tetoBtn.addEventListener('pointerdown', () => {
      tetoBtn.classList.add('is-pressed');
    });

    function releaseButton() {
      tetoBtn.classList.remove('is-pressed');
    }

    tetoBtn.addEventListener('pointerup', releaseButton);
    tetoBtn.addEventListener('pointercancel', releaseButton);
    tetoBtn.addEventListener('pointerleave', releaseButton);
    tetoBtn.addEventListener('click', playTetoSound);
  </script>
</body>
</html>
