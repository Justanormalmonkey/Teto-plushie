<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Teto</title>
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      background-color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }

    .teto-button {
      background: transparent;
      border: none;
      padding: 12px;
      margin: 0;
      cursor: pointer;
      outline: none;
      touch-action: manipulation;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.14s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .teto-button:focus-visible {
      outline: 3px solid #e64966;
      outline-offset: 6px;
      border-radius: 20px;
    }

    @media (hover: hover) {
      .teto-button:hover {
        transform: scale(1.03);
      }
    }

    .teto-button.is-pressed,
    .teto-button:active {
      transform: scale(0.92);
    }

    .teto-img {
      display: none;
      max-width: min(58vw, 240px);
      max-height: 55vh;
      width: auto;
      height: auto;
      object-fit: contain;
      pointer-events: none;
      -webkit-user-drag: none;
    }

    .teto-img.is-active {
      display: block;
    }

    .teto-img.is-mirrored {
      transform: scaleX(-1);
    }
  </style>
</head>
<body>

  <button id="tetoBtn" class="teto-button" type="button" aria-label="Press Kasane Teto plush">
    <img id="imgFront" src="teto-plush.png.JPG" alt="Kasane Teto Plush" class="teto-img is-active" draggable="false" />
  </button>

  <script>
    const tetoBtn = document.getElementById('tetoBtn');
    const imgFront = document.getElementById('imgFront');
    const SOUND_URL = 'teto-sound.mp3.mp3';

    // Preload and mount spin frames
    const EXTS = ['JPG', 'jpg', 'PNG', 'png', 'JPEG', 'jpeg', 'WEBP', 'webp'];
    let poseElements = [imgFront];
    let currentPose = 0;

    function probeSingle(url) {
      return new Promise((resolve) => {
        const img = new Image();
        img.onload = () => resolve(url);
        img.onerror = () => resolve(null);
        img.src = url;
      });
    }

    async function findPoseImage(baseName) {
      const results = await Promise.all(EXTS.map((ext) => probeSingle(`${baseName}.${ext}`)));
      return results.find(Boolean) || null;
    }

    function createPoseImg(src, mirrored) {
      const img = document.createElement('img');
      img.src = src;
      img.alt = 'Kasane Teto Plush';
      img.draggable = false;
      img.className = mirrored ? 'teto-img is-mirrored' : 'teto-img';
      tetoBtn.appendChild(img);
      return img;
    }

    (async () => {
      const [leftSrc, backSrc, rightSrc] = await Promise.all([
        findPoseImage('teto-left'),
        findPoseImage('teto-back'),
        findPoseImage('teto-right')
      ]);

      const nextPoses = [imgFront];
      if (leftSrc) nextPoses.push(createPoseImg(leftSrc, false));
      if (backSrc) nextPoses.push(createPoseImg(backSrc, false));
      if (rightSrc) {
        nextPoses.push(createPoseImg(rightSrc, false));
      } else if (leftSrc) {
        nextPoses.push(createPoseImg(leftSrc, true));
      }

      if (nextPoses.length > 1) {
        poseElements = nextPoses;
      }
    })();

    function turnTeto() {
      if (poseElements.length <= 1) return;
      poseElements[currentPose].classList.remove('is-active');
      currentPose = (currentPose + 1) % poseElements.length;
      poseElements[currentPose].classList.add('is-active');
    }

    // Instant stacking Web Audio
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    const audioCtx = AudioCtx ? new AudioCtx() : null;
    let tetoBuffer = null;

    const fallbackAudio = new Audio(SOUND_URL);
    fallbackAudio.preload = 'auto';

    if (audioCtx) {
      fetch(SOUND_URL)
        .then((res) => res.arrayBuffer())
        .then((data) => new Promise((resolve, reject) => {
          audioCtx.decodeAudioData(data, resolve, reject);
        }))
        .then((decoded) => {
          tetoBuffer = decoded;
        })
        .catch(() => {});
    }

    function playTetoSound() {
      if (audioCtx && tetoBuffer) {
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
        const source = audioCtx.createBufferSource();
        source.buffer = tetoBuffer;
        source.connect(audioCtx.destination);
        source.start(0);
        return;
      }

      try {
        const clone = fallbackAudio.cloneNode();
        clone.play().catch(() => {});
      } catch (e) {}
    }

    tetoBtn.addEventListener('pointerdown', (e) => {
      if (e.button && e.button !== 0) return;
      tetoBtn.classList.add('is-pressed');
      turnTeto();
      playTetoSound();
    });

    function releaseButton() {
      tetoBtn.classList.remove('is-pressed');
    }

    tetoBtn.addEventListener('pointerup', releaseButton);
    tetoBtn.addEventListener('pointercancel', releaseButton);
    tetoBtn.addEventListener('pointerleave', releaseButton);

    tetoBtn.addEventListener('click', () => {
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    });

    tetoBtn.addEventListener('keydown', (e) => {
      if ((e.key === 'Enter' || e.key === ' ') && !e.repeat) {
        e.preventDefault();
        tetoBtn.classList.add('is-pressed');
        turnTeto();
        playTetoSound();
      }
    });

    tetoBtn.addEventListener('keyup', (e) => {
      if (e.key === 'Enter' || e.key === ' ') {
        releaseButton();
      }
    });
  </script>
</body>
</html>
