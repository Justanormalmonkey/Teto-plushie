<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Teto Clicker</title>
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      background-color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* Top HUD */
    .top-bar {
      position: fixed;
      top: calc(14px + env(safe-area-inset-top));
      left: 0;
      right: 0;
      padding: 0 max(12px, env(safe-area-inset-right)) 0 max(12px, env(safe-area-inset-left));
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 6px;
      z-index: 20;
      pointer-events: none;
    }

    .counter-pill {
      justify-self: start;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #f6f6f8;
      border: 1px solid #e6e6ea;
      border-radius: 999px;
      padding: 6px 11px;
      pointer-events: auto;
      max-width: 100%;
    }

    .counter-icon {
      width: 20px;
      height: 20px;
      object-fit: contain;
      flex-shrink: 0;
      display: block;
    }

    .counter-emoji {
      font-size: 16px;
      line-height: 1;
      flex-shrink: 0;
    }

    .counter-value {
      font-size: 15px;
      font-weight: 700;
      color: #1c1c1e;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .top-tabs {
      justify-self: center;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      pointer-events: auto;
    }

    .nav-btn {
      background: #1c1c1e;
      color: #ffffff;
      border: none;
      border-radius: 999px;
      padding: 8px 14px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      touch-action: manipulation;
      transition: transform 0.12s ease, opacity 0.15s ease;
    }

    .nav-btn.is-skins {
      background: #e64966;
    }

    .nav-btn:active {
      transform: scale(0.94);
    }

    @media (hover: hover) {
      .nav-btn:hover {
        opacity: 0.9;
      }
    }

    /* Steel Ball toggle (hidden until purchased) */
    .steel-ball-btn {
      justify-self: end;
      pointer-events: auto;
      width: clamp(42px, 11vw, 52px);
      height: clamp(42px, 11vw, 52px);
      padding: 0;
      margin: 0;
      background: transparent;
      border: none;
      border-radius: 50%;
      cursor: pointer;
      outline: none;
      touch-action: manipulation;
      display: none;
      align-items: center;
      justify-content: center;
      opacity: 0.48;
      filter: grayscale(65%);
      transition: transform 0.14s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.2s ease, filter 0.2s ease;
    }

    .steel-ball-btn.is-unlocked {
      display: inline-flex;
    }

    .steel-ball-btn.is-active {
      opacity: 1;
      filter: drop-shadow(0 0 8px rgba(102, 224, 52, 0.7));
    }

    @media (hover: hover) {
      .steel-ball-btn:hover {
        transform: scale(1.06);
      }
    }

    .steel-ball-btn.is-pressed,
    .steel-ball-btn:active {
      transform: scale(0.88);
    }

    .steel-ball-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      pointer-events: none;
      -webkit-user-drag: none;
    }

    .steel-ball-btn.is-active .steel-ball-img {
      animation: steelBallSpin 2.2s linear infinite;
    }

    @keyframes steelBallSpin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    /* Main Teto Button */
    .teto-button {
      position: relative;
      z-index: 5;
      background: transparent;
      border: none;
      padding: 12px;
      margin: 0;
      cursor: pointer;
      outline: none;
      touch-action: manipulation;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.14s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .teto-button:focus-visible {
      outline: 3px solid #e64966;
      outline-offset: 6px;
      border-radius: 20px;
    }

    @media (hover: hover) {
      .teto-button:hover {
        transform: scale(1.03);
      }
    }

    .teto-button.is-pressed,
    .teto-button:active {
      transform: scale(0.92);
    }

    .teto-img {
      display: none;
      max-width: min(58vw, 240px);
      max-height: 55vh;
      width: auto;
      height: auto;
      object-fit: contain;
      pointer-events: none;
      -webkit-user-drag: none;
    }

    .teto-img.is-active {
      display: block;
    }

    .teto-img.is-mirrored {
      transform: scaleX(-1);
    }

    /* Jumping Baguette Particles */
    .baguette-particle {
      position: fixed;
      top: 0;
      left: 0;
      width: 34px;
      height: 34px;
      object-fit: contain;
      pointer-events: none;
      z-index: 10;
      will-change: transform, opacity;
      font-size: 26px;
      line-height: 34px;
      text-align: center;
    }

    /* Unlock Toast */
    .unlock-toast {
      position: fixed;
      bottom: calc(40px + env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%) translateY(10px);
      background: #1c1c1e;
      color: #ffffff;
      font-size: 13px;
      font-weight: 600;
      padding: 9px 16px;
      border-radius: 999px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.18);
      opacity: 0;
      pointer-events: none;
      z-index: 40;
      white-space: nowrap;
      transition: opacity 0.22s ease, transform 0.22s ease;
    }

    .unlock-toast.is-visible {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* Bottom Version Label */
    .version-label {
      position: fixed;
      bottom: calc(12px + env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%);
      font-size: 12px;
      font-weight: 500;
      color: #9e9ea7;
      letter-spacing: 0.02em;
      pointer-events: none;
      z-index: 15;
    }

    /* Modals (Shop & Skins) */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.38);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 50;
    }

    .modal-overlay.is-open {
      display: flex;
    }

    .modal-card {
      width: 100%;
      max-width: 400px;
      max-height: 82vh;
      overflow-y: auto;
      background: #ffffff;
      border-radius: 22px;
      padding: 18px;
      box-shadow: 0 18px 45px rgba(0, 0, 0, 0.18);
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .modal-title-wrap {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .modal-title {
      font-size: 20px;
      font-weight: 700;
      color: #1c1c1e;
      margin: 0;
    }

    .modal-subtitle {
      font-size: 13px;
      color: #66666e;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .modal-close-btn {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: none;
      background: #f2f2f5;
      color: #333336;
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .item-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .item-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 11px;
      border-radius: 16px;
      background: #f8f8fa;
      border: 1px solid #ececf0;
    }

    .item-row.is-locked .item-img,
    .item-row.is-locked .item-emoji {
      opacity: 0.5;
    }

    .item-img {
      width: 48px;
      height: 48px;
      object-fit: contain;
      flex-shrink: 0;
      display: block;
      border-radius: 8px;
    }

    .item-emoji {
      width: 48px;
      height: 48px;
      font-size: 32px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .item-info {
      flex: 1;
      min-width: 0;
    }

    .item-name-row {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 3px;
    }

    .item-name {
      font-size: 15px;
      font-weight: 700;
      color: #1c1c1e;
      margin: 0;
    }

    .mult-badge {
      font-size: 11px;
      font-weight: 700;
      background: #ffe9ee;
      color: #d63354;
      padding: 2px 7px;
      border-radius: 999px;
    }

    .item-desc {
      font-size: 12px;
      color: #5c5c64;
      line-height: 1.35;
      margin: 0;
    }

    .item-meta {
      font-size: 11px;
      font-weight: 600;
      color: #e64966;
      margin-top: 4px;
    }

    .item-row.is-locked .item-meta {
      color: #7c7c85;
      font-style: italic;
      font-weight: 500;
    }

    .action-btn {
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      background: #e64966;
      color: #ffffff;
      border: none;
      border-radius: 12px;
      padding: 9px 12px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      min-width: 82px;
      touch-action: manipulation;
    }

    .action-btn:disabled {
      background: #d5d5da;
      color: #8a8a92;
      cursor: not-allowed;
    }

    .action-btn.is-equipped {
      background: #1c1c1e;
      color: #ffffff;
    }

    .action-btn.is-owned {
      background: #34c759;
      color: #ffffff;
      cursor: default;
    }

    .mini-baguette-icon {
      width: 15px;
      height: 15px;
      object-fit: contain;
      display: inline-block;
    }
  </style>
</head>
<body>

  <!-- Top HUD -->
  <div class="top-bar">
    <div class="counter-pill" aria-label="Baguettes count">
      <span id="counterIconSlot"></span>
      <span id="baguetteCount" class="counter-value">0</span>
    </div>

    <div class="top-tabs">
      <button id="shopOpenBtn" class="nav-btn" type="button">Shop</button>
      <button id="skinsOpenBtn" class="nav-btn is-skins" type="button">Skins</button>
    </div>

    <button id="steelBallBtn" class="steel-ball-btn" type="button" aria-label="Toggle Teto spin" aria-pressed="false">
      <img src="steel-ball.png.PNG" alt="Gyro's Steel Ball" class="steel-ball-img" draggable="false" />
    </button>
  </div>

  <!-- Center Plushie -->
  <button id="tetoBtn" class="teto-button" type="button" aria-label="Press Kasane Teto plush">
    <img id="imgFront" src="teto-front.png.PNG" alt="Teto Front" class="teto-img is-active" draggable="false" />
    <img id="imgBaguetteTeto" alt="Baguette Teto Front" class="teto-img" draggable="false" />
    <img id="imgLeft" src="teto-left.png.JPG" alt="Teto Left" class="teto-img" draggable="false" />
    <img id="imgFatTeto" alt="Fat Teto Left" class="teto-img" draggable="false" />
    <img id="imgBack" src="teto-back.png.png" alt="Teto Back" class="teto-img" draggable="false" />
    <img id="imgRight" src="teto-left.png.JPG" alt="Teto Right" class="teto-img is-mirrored" draggable="false" />
    <img id="imgFatTetoRight" alt="Fat Teto Right" class="teto-img is-mirrored" draggable="false" />
    <img id="imgPearto" alt="Pearto" class="teto-img" draggable="false" />
    <img id="imgPoteto" alt="Poteto" class="teto-img" draggable="false" />
  </button>

  <!-- Unlock Notification -->
  <div id="unlockToast" class="unlock-toast" role="status" aria-live="polite"></div>

  <!-- Version Label -->
  <div class="version-label">version 4.0</div>

  <!-- Shop Modal -->
  <div id="shopOverlay" class="modal-overlay" role="dialog" aria-modal="true" aria-label="Item Shop">
    <div class="modal-card">
      <div class="modal-header">
        <div class="modal-title-wrap">
          <h2 class="modal-title">Shop</h2>
          <div class="modal-subtitle">
            <span>Baguettes:</span>
            <span id="shopBalanceIconSlot"></span>
            <strong id="shopBalanceValue">0</strong>
          </div>
        </div>
        <button id="shopCloseBtn" class="modal-close-btn" type="button" aria-label="Close shop">✕</button>
      </div>

      <div class="item-list">
        <div class="item-row">
          <span id="shopBaguetteImgSlot"></span>
          <div class="item-info">
            <div class="item-name-row">
              <h3 class="item-name">Baguette Upgrade</h3>
            </div>
            <p class="item-desc">Increases baguettes your clicks give by +1.</p>
            <div id="baguettePowerMeta" class="item-meta">Per click: +1</div>
          </div>
          <button id="buyUpgradeBtn" class="action-btn" type="button"></button>
        </div>

        <div class="item-row">
          <img src="steel-ball.png.PNG" alt="Gyro's Steel Ball" class="item-img" draggable="false" />
          <div class="item-info">
            <div class="item-name-row">
              <h3 class="item-name">Gyro's Steel Ball</h3>
              <span class="mult-badge">2×</span>
            </div>
            <p class="item-desc">An emerald sphere humming with the Golden Ratio. Teaches Teto the secret of the Spin.</p>
            <div class="item-meta">2× Baguettes • Unlocks Spin</div>
          </div>
          <button id="buyBallBtn" class="action-btn" type="button"></button>
        </div>
      </div>
    </div>
  </div>

  <!-- Skins Modal -->
  <div id="skinsOverlay" class="modal-overlay" role="dialog" aria-modal="true" aria-label="Skins">
    <div class="modal-card">
      <div class="modal-header">
        <div class="modal-title-wrap">
          <h2 class="modal-title">Skins</h2>
          <div id="skinsMultiplierInfo" class="modal-subtitle">Universal Multiplier: 1×</div>
        </div>
        <button id="skinsCloseBtn" class="modal-close-btn" type="button" aria-label="Close skins">✕</button>
      </div>
      <div id="skinsList" class="item-list"></div>
    </div>
  </div>

  <script>
    const SAVE_KEY_V4 = 'tetoClickerSave_v4';
    const SAVE_KEY_V3 = 'tetoClickerSave_v3';

    const tetoBtn = document.getElementById('tetoBtn');
    const allPoseImgs = Array.from(document.querySelectorAll('.teto-img'));
    const imgFront = document.getElementById('imgFront');
    const imgBaguetteTeto = document.getElementById('imgBaguetteTeto');
    const imgLeft = document.getElementById('imgLeft');
    const imgFatTeto = document.getElementById('imgFatTeto');
    const imgBack = document.getElementById('imgBack');
    const imgRight = document.getElementById('imgRight');
    const imgFatTetoRight = document.getElementById('imgFatTetoRight');
    const imgPearto = document.getElementById('imgPearto');
    const imgPoteto = document.getElementById('imgPoteto');

    const steelBallBtn = document.getElementById('steelBallBtn');
    const baguetteCountEl = document.getElementById('baguetteCount');
    const unlockToast = document.getElementById('unlockToast');

    const shopOpenBtn = document.getElementById('shopOpenBtn');
    const shopOverlay = document.getElementById('shopOverlay');
    const shopCloseBtn = document.getElementById('shopCloseBtn');
    const shopBalanceValueEl = document.getElementById('shopBalanceValue');
    const baguettePowerMeta = document.getElementById('baguettePowerMeta');
    const buyUpgradeBtn = document.getElementById('buyUpgradeBtn');
    const buyBallBtn = document.getElementById('buyBallBtn');

    const skinsOpenBtn = document.getElementById('skinsOpenBtn');
    const skinsOverlay = document.getElementById('skinsOverlay');
    const skinsCloseBtn = document.getElementById('skinsCloseBtn');
    const skinsMultiplierInfo = document.getElementById('skinsMultiplierInfo');
    const skinsList = document.getElementById('skinsList');

    const counterIconSlot = document.getElementById('counterIconSlot');
    const shopBalanceIconSlot = document.getElementById('shopBalanceIconSlot');
    const shopBaguetteImgSlot = document.getElementById('shopBaguetteImgSlot');

    // Game State
    let baguettes = 0;
    let baguetteUpgrades = 0;
    let hasBall = false;
    let spinActive = false;
    let currentPose = 0;

    let mainSkin = 'teto';
    let fatTetoEquipped = false;
    let baguetteTetoSideClicks = 0;
    let fatTetoSpinMs = 0;

    let unlocked = {
      teto: true,
      baguetteTeto: false,
      fatTeto: false,
      poteto: false,
      pearto: false
    };

    const skinImages = {
      teto: 'teto-front.png.PNG',
      baguetteTeto: null,
      fatTeto: null,
      poteto: null,
      pearto: null,
      baguette: null
    };

    try {
      const rawV4 = localStorage.getItem(SAVE_KEY_V4);
      if (rawV4) {
        const s = JSON.parse(rawV4);
        if (typeof s.baguettes === 'number') baguettes = s.baguettes;
        if (typeof s.baguetteUpgrades === 'number') baguetteUpgrades = s.baguetteUpgrades;
        if (typeof s.hasBall === 'boolean') hasBall = s.hasBall;
        if (typeof s.mainSkin === 'string') mainSkin = s.mainSkin;
        if (typeof s.fatTetoEquipped === 'boolean') fatTetoEquipped = s.fatTetoEquipped;
        if (typeof s.baguetteTetoSideClicks === 'number') baguetteTetoSideClicks = s.baguetteTetoSideClicks;
        if (typeof s.fatTetoSpinMs === 'number') fatTetoSpinMs = s.fatTetoSpinMs;
        if (s.unlocked && typeof s.unlocked === 'object') {
          unlocked = { ...unlocked, ...s.unlocked, teto: true };
        }
      } else {
        const rawV3 = localStorage.getItem(SAVE_KEY_V3);
        if (rawV3) {
          const s3 = JSON.parse(rawV3);
          if (typeof s3.baguettes === 'number') baguettes = s3.baguettes;
          if (typeof s3.baguetteUpgrades === 'number') baguetteUpgrades = s3.baguetteUpgrades;
          if (typeof s3.hasBall === 'boolean') hasBall = s3.hasBall;
        }
      }
    } catch (e) {}

    function saveGame() {
      try {
        localStorage.setItem(SAVE_KEY_V4, JSON.stringify({
          baguettes,
          baguetteUpgrades,
          hasBall,
          mainSkin,
          fatTetoEquipped,
          baguetteTetoSideClicks,
          fatTetoSpinMs,
          unlocked
        }));
      } catch (e) {}
    }

    let toastTimer = null;
    function showUnlockToast(text) {
      unlockToast.textContent = text;
      unlockToast.classList.add('is-visible');
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        unlockToast.classList.remove('is-visible');
      }, 3200);
    }

    function checkUnlocks(announce = true) {
      const newlyUnlocked = [];
      if (!unlocked.baguetteTeto && baguetteUpgrades >= 8) {
        unlocked.baguetteTeto = true;
        newlyUnlocked.push('Baguette Teto (2×)');
      }
      if (!unlocked.fatTeto && baguetteTetoSideClicks >= 100) {
        unlocked.fatTeto = true;
        newlyUnlocked.push('Fat Teto (3×)');
      }
      if (!unlocked.poteto && fatTetoSpinMs >= 60000) {
        unlocked.poteto = true;
        newlyUnlocked.push('Poteto (4×)');
      }
      if (!unlocked.pearto && baguettes >= 1000000) {
        unlocked.pearto = true;
        newlyUnlocked.push('Pearto (5×)');
      }

      if (newlyUnlocked.length > 0) {
        saveGame();
        if (announce) {
          showUnlockToast(`Unlocked: ${newlyUnlocked.join(', ')}!`);
        }
      }
    }

    function canSpinSkin(skinId = mainSkin) {
      return skinId === 'teto' || skinId === 'baguette-teto';
    }

    function getSkinMultiplier() {
      let best = 1;
      if (unlocked.baguetteTeto) best = Math.max(best, 2);
      if (unlocked.fatTeto) best = Math.max(best, 3);
      if (unlocked.poteto) best = Math.max(best, 4);
      if (unlocked.pearto) best = Math.max(best, 5);
      return best;
    }

    function getTotalMultiplier() {
      return getSkinMultiplier() * (hasBall ? 2 : 1);
    }

    function getUpgradeCost() {
      return 100 * Math.pow(2, baguetteUpgrades);
    }

    function getPerClick() {
      return (1 + baguetteUpgrades) * getTotalMultiplier();
    }

    function renderPose() {
      allPoseImgs.forEach((img) => img.classList.remove('is-active'));

      if (mainSkin === 'pearto' && skinImages.pearto) {
        imgPearto.classList.add('is-active');
        return;
      }
      if (mainSkin === 'poteto' && skinImages.poteto) {
        imgPoteto.classList.add('is-active');
        return;
      }

      if (currentPose === 0) {
        if (mainSkin === 'baguette-teto' && skinImages.baguetteTeto) {
          imgBaguetteTeto.classList.add('is-active');
        } else {
          imgFront.classList.add('is-active');
        }
      } else if (currentPose === 1) {
        if (fatTetoEquipped && skinImages.fatTeto) {
          imgFatTeto.classList.add('is-active');
        } else {
          imgLeft.classList.add('is-active');
        }
      } else if (currentPose === 2) {
        imgBack.classList.add('is-active');
      } else if (currentPose === 3) {
        if (fatTetoEquipped && skinImages.fatTeto) {
          imgFatTetoRight.classList.add('is-active');
        } else {
          imgRight.classList.add('is-active');
        }
      }
    }

    function makeMiniBaguetteHTML() {
      return skinImages.baguette
        ? `<img src="${skinImages.baguette}" alt="" class="mini-baguette-icon" draggable="false" />`
        : '<span>🥖</span>';
    }

    function renderBaguetteIcons() {
      if (skinImages.baguette) {
        counterIconSlot.innerHTML = `<img src="${skinImages.baguette}" alt="Baguette" class="counter-icon" draggable="false" />`;
        shopBalanceIconSlot.innerHTML = `<img src="${skinImages.baguette}" alt="" class="mini-baguette-icon" draggable="false" />`;
        shopBaguetteImgSlot.innerHTML = `<img src="${skinImages.baguette}" alt="Baguette Upgrade" class="item-img" draggable="false" />`;
      } else {
        counterIconSlot.innerHTML = `<span class="counter-emoji">🥖</span>`;
        shopBalanceIconSlot.innerHTML = `<span>🥖</span>`;
        shopBaguetteImgSlot.innerHTML = `<span class="item-emoji">🥖</span>`;
      }
    }

    function renderSkinsUI() {
      const skinMult = getSkinMultiplier();
      const totalMult = getTotalMultiplier();
      skinsMultiplierInfo.textContent = hasBall
        ? `Skin: ${skinMult}× • Ball: 2× • Total: ${totalMult}×`
        : `Universal Skin Multiplier: ${skinMult}×`;

      const skinDefs = [
        {
          id: 'teto',
          name: 'Teto',
          mult: '1×',
          img: skinImages.teto,
          fallbackEmoji: '🎀',
          desc: 'Default Teto plushie. Can spin.',
          isUnlocked: true,
          hint: 'Starter skin',
          isAddon: false
        },
        {
          id: 'baguette-teto',
          name: 'Baguette Teto',
          mult: '2×',
          img: skinImages.baguetteTeto,
          fallbackEmoji: '🥖',
          desc: 'Teto holding a baguette. Can spin.',
          isUnlocked: unlocked.baguetteTeto,
          hint: 'Hint: Keep upgrading your baguettes until she gets hungry...',
          isAddon: false
        },
        {
          id: 'fat-teto',
          name: 'Fat Teto',
          mult: '3×',
          img: skinImages.fatTeto,
          fallbackEmoji: '🧸',
          desc: 'Left/Right side skin for Teto or Baguette Teto. Can spin.',
          isUnlocked: unlocked.fatTeto,
          hint: 'Hint: Baguette Teto hides a rounder side if you poke her sideways enough...',
          isAddon: true
        },
        {
          id: 'poteto',
          name: 'Poteto',
          mult: '4×',
          img: skinImages.poteto,
          fallbackEmoji: '🥔',
          desc: 'Potato Teto. Cannot spin.',
          isUnlocked: unlocked.poteto,
          hint: 'Hint: Let a heavier side of Teto experience the Spin for a little while...',
          isAddon: false
        },
        {
          id: 'pearto',
          name: 'Pearto',
          mult: '5×',
          img: skinImages.pearto,
          fallbackEmoji: '🍐',
          desc: 'Pear Teto. Cannot spin.',
          isUnlocked: unlocked.pearto,
          hint: 'Hint: Only a true baguette millionaire is worthy...',
          isAddon: false
        }
      ];

      skinsList.innerHTML = '';

      skinDefs.forEach((skin) => {
        const row = document.createElement('div');
        row.className = skin.isUnlocked ? 'item-row' : 'item-row is-locked';

        const iconHtml = skin.img
          ? `<img src="${skin.img}" alt="${skin.name}" class="item-img" draggable="false" />`
          : `<span class="item-emoji">${skin.fallbackEmoji}</span>`;

        const metaText = skin.isUnlocked
          ? (skin.isAddon ? 'Add-on for Teto & Baguette Teto • Unlocked' : 'Unlocked • Multiplier Active')
          : skin.hint;

        row.innerHTML = `
          ${iconHtml}
          <div class="item-info">
            <div class="item-name-row">
              <h3 class="item-name">${skin.name}</h3>
              <span class="mult-badge">${skin.mult}</span>
            </div>
            <p class="item-desc">${skin.desc}</p>
            <div class="item-meta">${metaText}</div>
          </div>
        `;

        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'action-btn';

        if (!skin.isUnlocked) {
          btn.textContent = 'Locked';
          btn.disabled = true;
        } else if (skin.isAddon) {
          if (!canSpinSkin()) {
            btn.textContent = fatTetoEquipped ? 'Unequip' : 'Teto Only';
            if (!fatTetoEquipped) btn.disabled = true;
          } else if (fatTetoEquipped) {
            btn.textContent = 'Unequip';
            btn.classList.add('is-equipped');
          } else {
            btn.textContent = 'Equip';
          }
          btn.addEventListener('click', () => {
            if (!unlocked.fatTeto) return;
            if (!fatTetoEquipped && !canSpinSkin()) return;
            fatTetoEquipped = !fatTetoEquipped;
            saveGame();
            renderPose();
            updateUI();
          });
        } else {
          if (mainSkin === skin.id) {
            btn.textContent = skin.id === 'teto' ? 'Equipped' : 'Unequip';
            btn.classList.add('is-equipped');
            if (skin.id === 'teto') btn.disabled = true;
          } else {
            btn.textContent = 'Equip';
          }
          btn.addEventListener('click', () => {
            if (mainSkin === skin.id) {
              mainSkin = 'teto';
            } else {
              mainSkin = skin.id;
            }
            if (!canSpinSkin()) {
              currentPose = 0;
            }
            saveGame();
            renderPose();
            updateUI();
          });
        }

        row.appendChild(btn);
        skinsList.appendChild(row);
      });
    }

    function updateUI() {
      baguetteCountEl.textContent = baguettes.toLocaleString();
      shopBalanceValueEl.textContent = baguettes.toLocaleString();

      const perClick = getPerClick();
      const totalMult = getTotalMultiplier();
      baguettePowerMeta.textContent = `Per click: +${perClick.toLocaleString()} (${totalMult}× total)`;

      const upgCost = getUpgradeCost();
      buyUpgradeBtn.innerHTML = `${makeMiniBaguetteHTML()} <span>${upgCost.toLocaleString()}</span>`;
      buyUpgradeBtn.disabled = baguettes < upgCost;

      if (hasBall) {
        steelBallBtn.classList.add('is-unlocked');
        buyBallBtn.textContent = 'Owned';
        buyBallBtn.classList.add('is-owned');
        buyBallBtn.disabled = true;
      } else {
        steelBallBtn.classList.remove('is-unlocked');
        buyBallBtn.innerHTML = `${makeMiniBaguetteHTML()} <span>1,000</span>`;
        buyBallBtn.classList.remove('is-owned');
        buyBallBtn.disabled = baguettes < 1000;
      }

      if (skinsOverlay.classList.contains('is-open')) {
        renderSkinsUI();
      }
    }

    const EXTS = [
      'PNG', 'png', 'JPG', 'jpg', 'JPEG', 'jpeg',
      'WEBP', 'webp', 'AVIF', 'avif',
      'png.PNG', 'png.png', 'png.JPG', 'png.jpg', 'png.WEBP', 'png.AVIF', 'jpg.JPG', 'jpg.jpg'
    ];

    function probeImg(url) {
      return new Promise((resolve) => {
        const img = new Image();
        img.onload = () => resolve(url);
        img.onerror = () => resolve(null);
        img.src = url;
      });
    }

    async function findAnyExt(names) {
      const checks = [];
      for (const name of names) {
        for (const ext of EXTS) {
          checks.push(probeImg(`${name}.${ext}`));
        }
      }
      const results = await Promise.all(checks);
      return results.find(Boolean) || null;
    }

    checkUnlocks(false);
    renderBaguetteIcons();
    renderPose();
    updateUI();

    (async () => {
      const [baguetteUrl, bagTetoUrl, fatTetoUrl, peartoUrl, potetoUrl] = await Promise.all([
        findAnyExt(['baguette', 'teto-baguette']),
        findAnyExt(['baguette-teto', 'teto-baguette-skin']),
        findAnyExt(['fat-teto', 'teto-fat']),
        findAnyExt(['pearto']),
        findAnyExt(['poteto'])
      ]);

      if (baguetteUrl) {
        skinImages.baguette = baguetteUrl;
        renderBaguetteIcons();
      }
      if (bagTetoUrl) {
        skinImages.baguetteTeto = bagTetoUrl;
        imgBaguetteTeto.src = bagTetoUrl;
      }
      if (fatTetoUrl) {
        skinImages.fatTeto = fatTetoUrl;
        imgFatTeto.src = fatTetoUrl;
        imgFatTetoRight.src = fatTetoUrl;
      }
      if (peartoUrl) {
        skinImages.pearto = peartoUrl;
        imgPearto.src = peartoUrl;
      }
      if (potetoUrl) {
        skinImages.poteto = potetoUrl;
        imgPoteto.src = potetoUrl;
      }

      renderPose();
      updateUI();
    })();

    // Modals
    shopOpenBtn.addEventListener('click', () => {
      skinsOverlay.classList.remove('is-open');
      updateUI();
      shopOverlay.classList.add('is-open');
    });

    shopCloseBtn.addEventListener('click', () => {
      shopOverlay.classList.remove('is-open');
    });

    shopOverlay.addEventListener('click', (e) => {
      if (e.target === shopOverlay) shopOverlay.classList.remove('is-open');
    });

    skinsOpenBtn.addEventListener('click', () => {
      shopOverlay.classList.remove('is-open');
      renderSkinsUI();
      skinsOverlay.classList.add('is-open');
    });

    skinsCloseBtn.addEventListener('click', () => {
      skinsOverlay.classList.remove('is-open');
    });

    skinsOverlay.addEventListener('click', (e) => {
      if (e.target === skinsOverlay) skinsOverlay.classList.remove('is-open');
    });

    // Shop Purchases
    buyUpgradeBtn.addEventListener('click', () => {
      const cost = getUpgradeCost();
      if (baguettes < cost) return;
      baguettes -= cost;
      baguetteUpgrades += 1;
      checkUnlocks(true);
      saveGame();
      updateUI();
    });

    buyBallBtn.addEventListener('click', () => {
      if (hasBall || baguettes < 1000) return;
      baguettes -= 1000;
      hasBall = true;
      saveGame();
      updateUI();
    });

    // Spin Controls
    function turnTeto() {
      currentPose = (currentPose + 1) % 4;
      renderPose();
    }

    steelBallBtn.addEventListener('pointerdown', (e) => {
      if (e.button && e.button !== 0) return;
      steelBallBtn.classList.add('is-pressed');
    });

    function releaseBall() {
      steelBallBtn.classList.remove('is-pressed');
    }

    steelBallBtn.addEventListener('pointerup', releaseBall);
    steelBallBtn.addEventListener('pointercancel', releaseBall);
    steelBallBtn.addEventListener('pointerleave', releaseBall);

    steelBallBtn.addEventListener('click', () => {
      if (!hasBall) return;
      spinActive = !spinActive;
      steelBallBtn.classList.toggle('is-active', spinActive);
      steelBallBtn.setAttribute('aria-pressed', String(spinActive));
    });

    // Track spinning Fat Teto for 1 minute (60s) to unlock Poteto
    let saveTickCount = 0;
    setInterval(() => {
      if (!document.hidden && hasBall && spinActive && fatTetoEquipped && canSpinSkin() && !unlocked.poteto) {
        fatTetoSpinMs += 250;
        saveTickCount += 1;
        if (fatTetoSpinMs >= 60000) {
          checkUnlocks(true);
          saveGame();
          updateUI();
        } else if (saveTickCount % 8 === 0) {
          saveGame();
        }
      }
    }, 250);

    // Jumping Baguette Particles
    const activeParticles = [];
    let lastFrameTime = 0;
    let animRunning = false;

    function spawnBaguetteParticle() {
      if (activeParticles.length > 35) {
        const oldest = activeParticles.shift();
        oldest.el.remove();
      }

      const rect = tetoBtn.getBoundingClientRect();
      const startX = rect.left + rect.width * (0.35 + Math.random() * 0.3) - 17;
      const startY = rect.top + rect.height * (0.3 + Math.random() * 0.25) - 17;

      const el = skinImages.baguette ? document.createElement('img') : document.createElement('div');
      if (skinImages.baguette) {
        el.src = skinImages.baguette;
        el.alt = '';
        el.draggable = false;
      } else {
        el.textContent = '🥖';
      }
      el.className = 'baguette-particle';
      document.body.appendChild(el);

      activeParticles.push({
        el,
        x: startX,
        y: startY,
        vx: (Math.random() - 0.5) * 280,
        vy: -(330 + Math.random() * 170),
        rot: Math.random() * 360,
        vrot: (Math.random() - 0.5) * 520,
        life: 0,
        maxLife: 0.72
      });

      if (!animRunning) {
        animRunning = true;
        lastFrameTime = performance.now();
        requestAnimationFrame(stepParticles);
      }
    }

    function stepParticles(now) {
      const dt = Math.min((now - lastFrameTime) / 1000, 0.05);
      lastFrameTime = now;

      for (let i = activeParticles.length - 1; i >= 0; i--) {
        const p = activeParticles[i];
        p.life += dt;
        if (p.life >= p.maxLife) {
          p.el.remove();
          activeParticles.splice(i, 1);
          continue;
        }

        p.vy += 1050 * dt;
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.rot += p.vrot * dt;

        const progress = p.life / p.maxLife;
        const opacity = progress < 0.6 ? 1 : 1 - (progress - 0.6) / 0.4;

        p.el.style.transform = `translate3d(${p.x.toFixed(1)}px, ${p.y.toFixed(1)}px, 0) rotate(${p.rot.toFixed(1)}deg)`;
        p.el.style.opacity = opacity.toFixed(2);
      }

      if (activeParticles.length > 0) {
        requestAnimationFrame(stepParticles);
      } else {
        animRunning = false;
      }
    }

    // Instant Stacking Web Audio (shared across all skins)
    const SOUND_URL = 'teto-sound.mp3.mp3';
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    const audioCtx = AudioCtx ? new AudioCtx() : null;
    let tetoBuffer = null;

    const fallbackAudio = new Audio(SOUND_URL);
    fallbackAudio.preload = 'auto';

    if (audioCtx) {
      fetch(SOUND_URL)
        .then((res) => res.arrayBuffer())
        .then((data) => new Promise((resolve, reject) => {
          audioCtx.decodeAudioData(data, resolve, reject);
        }))
        .then((decoded) => {
          tetoBuffer = decoded;
        })
        .catch(() => {});
    }

    function playTetoSound() {
      if (audioCtx && tetoBuffer) {
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
        const source = audioCtx.createBufferSource();
        source.buffer = tetoBuffer;
        source.connect(audioCtx.destination);
        source.start(0);
        return;
      }

      try {
        const clone = fallbackAudio.cloneNode();
        clone.play().catch(() => {});
      } catch (e) {}
    }

    function handleTetoPress() {
      const isFacingSide = (currentPose === 1 || currentPose === 3);
      if (mainSkin === 'baguette-teto' && isFacingSide && !unlocked.fatTeto) {
        baguetteTetoSideClicks += 1;
      }

      baguettes += getPerClick();
      checkUnlocks(true);
      saveGame();
      updateUI();

      if (hasBall && spinActive && canSpinSkin()) {
        turnTeto();
      }
      spawnBaguetteParticle();
      playTetoSound();
    }

    tetoBtn.addEventListener('pointerdown', (e) => {
      if (e.button && e.button !== 0) return;
      tetoBtn.classList.add('is-pressed');
      handleTetoPress();
    });

    function releaseButton() {
      tetoBtn.classList.remove('is-pressed');
    }

    tetoBtn.addEventListener('pointerup', releaseButton);
    tetoBtn.addEventListener('pointercancel', releaseButton);
    tetoBtn.addEventListener('pointerleave', releaseButton);

    tetoBtn.addEventListener('click', () => {
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    });

    tetoBtn.addEventListener('keydown', (e) => {
      if ((e.key === 'Enter' || e.key === ' ') && !e.repeat) {
        e.preventDefault();
        tetoBtn.classList.add('is-pressed');
        handleTetoPress();
      }
    });

    tetoBtn.addEventListener('keyup', (e) => {
      if (e.key === 'Enter' || e.key === ' ') {
        releaseButton();
      }
    });
  </script>
</body>
</html>
