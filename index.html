<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Teto</title>
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      background-color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }

    .teto-button {
      background: transparent;
      border: none;
      padding: 12px;
      margin: 0;
      cursor: pointer;
      outline: none;
      touch-action: manipulation;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.14s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .teto-button:focus-visible {
      outline: 3px solid #e64966;
      outline-offset: 6px;
      border-radius: 20px;
    }

    @media (hover: hover) {
      .teto-button:hover {
        transform: scale(1.03);
      }
    }

    .teto-button.is-pressed,
    .teto-button:active {
      transform: scale(0.92);
    }

    .teto-img {
      display: none;
      max-width: min(58vw, 240px);
      max-height: 55vh;
      width: auto;
      height: auto;
      object-fit: contain;
      pointer-events: none;
      -webkit-user-drag: none;
    }

    .teto-img.is-active {
      display: block;
    }

    .teto-img.is-mirrored {
      transform: scaleX(-1);
    }

    .steel-ball-btn {
      position: fixed;
      top: calc(16px + env(safe-area-inset-top));
      right: calc(16px + env(safe-area-inset-right));
      width: clamp(48px, 13vw, 62px);
      height: clamp(48px, 13vw, 62px);
      padding: 0;
      margin: 0;
      background: transparent;
      border: none;
      border-radius: 50%;
      cursor: pointer;
      outline: none;
      touch-action: manipulation;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      filter: grayscale(65%);
      transition: transform 0.14s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.2s ease, filter 0.2s ease;
    }

    .steel-ball-btn.is-ready {
      opacity: 0.48;
    }

    .steel-ball-btn.is-ready.is-active {
      opacity: 1;
      filter: drop-shadow(0 0 8px rgba(102, 224, 52, 0.7));
    }

    @media (hover: hover) {
      .steel-ball-btn.is-ready:hover {
        transform: scale(1.06);
      }
    }

    .steel-ball-btn.is-pressed,
    .steel-ball-btn:active {
      transform: scale(0.88);
    }

    .steel-ball-btn:focus-visible {
      outline: 3px solid #5bc932;
      outline-offset: 4px;
    }

    .steel-ball-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      pointer-events: none;
      -webkit-user-drag: none;
    }

    .steel-ball-btn.is-active .steel-ball-img {
      animation: steelBallSpin 2.2s linear infinite;
    }

    @keyframes steelBallSpin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <button id="steelBallBtn" class="steel-ball-btn" type="button" aria-label="Toggle Teto spin" aria-pressed="false">
    <img id="steelBallImg" alt="Steel Ball Spin Toggle" class="steel-ball-img" draggable="false" />
  </button>

  <button id="tetoBtn" class="teto-button" type="button" aria-label="Press Kasane Teto plush">
    <img id="imgFront" alt="Kasane Teto Front" class="teto-img is-active" style="opacity: 0;" draggable="false" />
    <img id="imgLeft" src="teto-left.png.JPG" alt="Kasane Teto Left" class="teto-img" draggable="false" />
    <img id="imgBack" alt="Kasane Teto Back" class="teto-img" draggable="false" />
    <img id="imgRight" src="teto-left.png.JPG" alt="Kasane Teto Right" class="teto-img is-mirrored" draggable="false" />
  </button>

  <script>
    const tetoBtn = document.getElementById('tetoBtn');
    const imgFront = document.getElementById('imgFront');
    const imgLeft = document.getElementById('imgLeft');
    const imgBack = document.getElementById('imgBack');
    const imgRight = document.getElementById('imgRight');
    const steelBallBtn = document.getElementById('steelBallBtn');
    const steelBallImg = document.getElementById('steelBallImg');

    const poses = Array.from(document.querySelectorAll('.teto-img'));
    let currentPose = 0;
    let spinActive = false;

    const EXTS = [
      'PNG', 'png', 'JPG', 'jpg', 'JPEG', 'jpeg',
      'WEBP', 'webp', 'AVIF', 'avif',
      'png.PNG', 'png.JPG', 'png.WEBP', 'png.AVIF', 'jpg.JPG', 'png.JPEG'
    ];

    function probeImg(url) {
      return new Promise((resolve) => {
        const img = new Image();
        img.onload = () => resolve(url);
        img.onerror = () => resolve(null);
        img.src = url;
      });
    }

    async function findAnyExt(baseName) {
      const results = await Promise.all(EXTS.map((ext) => probeImg(`${baseName}.${ext}`)));
      return results.find(Boolean) || null;
    }

    imgFront.onload = () => {
      imgFront.style.opacity = '1';
    };

    steelBallImg.onload = () => {
      steelBallBtn.classList.add('is-ready');
    };

    (async () => {
      const [foundFront, foundLeft, foundBack, foundBall] = await Promise.all([
        findAnyExt('teto-front'),
        findAnyExt('teto-left'),
        findAnyExt('teto-back'),
        findAnyExt('steel-ball')
      ]);

      imgFront.src = foundFront || 'teto-plush.png.JPG';
      if (foundLeft) {
        imgLeft.src = foundLeft;
        imgRight.src = foundLeft;
      }
      imgBack.src = foundBack || 'teto-back.png.AVIF';
      if (foundBall) {
        steelBallImg.src = foundBall;
      }
    })();

    function turnTeto() {
      poses[currentPose].classList.remove('is-active');
      currentPose = (currentPose + 1) % poses.length;
      poses[currentPose].classList.add('is-active');
    }

    steelBallBtn.addEventListener('pointerdown', (e) => {
      if (e.button && e.button !== 0) return;
      steelBallBtn.classList.add('is-pressed');
    });

    function releaseBall() {
      steelBallBtn.classList.remove('is-pressed');
    }

    steelBallBtn.addEventListener('pointerup', releaseBall);
    steelBallBtn.addEventListener('pointercancel', releaseBall);
    steelBallBtn.addEventListener('pointerleave', releaseBall);

    steelBallBtn.addEventListener('click', () => {
      spinActive = !spinActive;
      steelBallBtn.classList.toggle('is-active', spinActive);
      steelBallBtn.setAttribute('aria-pressed', String(spinActive));
    });

    const SOUND_URL = 'teto-sound.mp3.mp3';
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    const audioCtx = AudioCtx ? new AudioCtx() : null;
    let tetoBuffer = null;

    const fallbackAudio = new Audio(SOUND_URL);
    fallbackAudio.preload = 'auto';

    if (audioCtx) {
      fetch(SOUND_URL)
        .then((res) => res.arrayBuffer())
        .then((data) => new Promise((resolve, reject) => {
          audioCtx.decodeAudioData(data, resolve, reject);
        }))
        .then((decoded) => {
          tetoBuffer = decoded;
        })
        .catch(() => {});
    }

    function playTetoSound() {
      if (audioCtx && tetoBuffer) {
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
        const source = audioCtx.createBufferSource();
        source.buffer = tetoBuffer;
        source.connect(audioCtx.destination);
        source.start(0);
        return;
      }

      try {
        const clone = fallbackAudio.cloneNode();
        clone.play().catch(() => {});
      } catch (e) {}
    }

    tetoBtn.addEventListener('pointerdown', (e) => {
      if (e.button && e.button !== 0) return;
      tetoBtn.classList.add('is-pressed');
      if (spinActive) turnTeto();
      playTetoSound();
    });

    function releaseButton() {
      tetoBtn.classList.remove('is-pressed');
    }

    tetoBtn.addEventListener('pointerup', releaseButton);
    tetoBtn.addEventListener('pointercancel', releaseButton);
    tetoBtn.addEventListener('pointerleave', releaseButton);

    tetoBtn.addEventListener('click', () => {
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    });

    tetoBtn.addEventListener('keydown', (e) => {
      if ((e.key === 'Enter' || e.key === ' ') && !e.repeat) {
        e.preventDefault();
        tetoBtn.classList.add('is-pressed');
        if (spinActive) turnTeto();
        playTetoSound();
      }
    });

    tetoBtn.addEventListener('keyup', (e) => {
      if (e.key === 'Enter' || e.key === ' ') {
        releaseButton();
      }
    });
  </script>
</body>
</html>
